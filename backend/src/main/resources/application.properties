server.port=${PORT:8080}

spring.application.name=swarnabhoomi-resort-api
spring.datasource.url=${DB_URL:jdbc:h2:mem:swarnabhoomi;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
app.mail.from=${MAIL_FROM:no-reply@swarnabhoomi.local}
app.mail.manager=${MANAGER_EMAIL:karanperumaln@gmail.com}
app.mail.enabled=${MAIL_ENABLED:false}
spring.h2.console.enabled=true
